[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-simplecoder"
version = "0.1.0"
description = "A terminal coding agent with ReAct tools, optional planning, and local-code RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.0.0",
    "click>=8.0.0",
    "numpy>=1.20.0",
    "rich>=13.0.0"
]

[project.scripts]
simplecoder = "simplecoder.main:main"

[tool.setuptools.packages.find]
include = ["simplecoder*"]

[tool.setuptools.package-data]
simplecoder = ["configs/*.json"]
